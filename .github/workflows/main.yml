name: Build STOVRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React
        run: npm run build

      - name: Check Capacitor Config
        run: |
          echo "CONFIG CONTENT:"
          cat capacitor.config.json
          echo "JSON VALIDATION:"
          node -e "const c=JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')); console.log(c); console.log('APP ID:', c.appId)"
          echo "CAPACITOR VERSION:"
          npx cap --version
          npx cap config

      - name: Create Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STOVRA-APK
          path: android/app/build/outputs/apk/debug/app-debug.ap
